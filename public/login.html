<body>
<div id="toast"></div>
<div class="login-wrap">
<div class="login-box">
<img class="login-logo" src="https://raw.githubusercontent.com/MakkaPakka518/Icon/refs/heads/main/MAKKA_EMBY.JPG" alt="logo" onerror="this.style.display='none'">
<h2>安全中心</h2>
<p class="login-sub">请输入访问密钥以继续</p>
<input type="password" id="tokenInput" placeholder="请输入密钥 TOKEN" onkeydown="if(event.key==='Enter') login()" autocomplete="off">
<button onclick="login()">验 证 登 录</button>
<p class="login-foot">登录后浏览器将记住本次授权</p>
</div>
</div>
<script>
function showToast(msg) {
const t = document.getElementById('toast');
const safe = escHtml(msg);
t.innerHTML = typeof toSvg === 'function' ? toSvg(safe) : safe;
t.classList.add('show');
setTimeout(() => t.classList.remove('show'), 2500);
}
async function login() {
const inputEl = document.getElementById('tokenInput');
const token = inputEl.value.trim();
if(!token) return showToast('⚠️ 请输入正确的密钥');
const btn = document.querySelector('.login-box button');
const origText = btn ? btn.textContent : '验 证 登 录';
if (btn) { btn.disabled = true; btn.textContent = '验 证 中...'; }
try {
const res = await fetch('/api/login', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ password: token })
});
const data = await res.json().catch(() => ({}));
if (res.ok && data.success) {
showToast('✅ 验证通过，正在进入控制台...');
setTimeout(() => window.location.reload(), 150);
} else {
showToast('❌ ' + (data.error || '密钥错误或登录受限'));
if (btn) { btn.disabled = false; btn.textContent = origText; }
}
} catch (e) {
showToast('❌ 网络请求异常，请稍后重试');
if (btn) { btn.disabled = false; btn.textContent = origText; }
}
}
</script>
